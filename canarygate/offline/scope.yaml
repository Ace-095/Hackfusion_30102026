# Synthetic fixture scope only. This is not organizer authorization.
scheme: https
hostname: fixture.invalid
port: 443
allowed_methods: [GET, POST]
request_budget: 20
accounts: [alice, bob]
operations:
  - {method: POST, path: /login, classification: AUTHENTICATION}
  - {method: GET, path: /items, classification: READ_ONLY}
  - {method: GET, path: /items/alice-item, classification: READ_ONLY, auth_probes: [missing, malformed, wrong_scheme]}
  - {method: GET, path: /items/bob-item, classification: READ_ONLY}
  - {method: GET, path: /items/nonexistent-item, classification: READ_ONLY, auth_probes: [missing]}
  # Each safe query is a separate exact scope entry, not a general query allow-list.
  - {method: GET, path: /search, classification: READ_ONLY}
  - {method: GET, path: /search, query: limit=1, classification: READ_ONLY}
  - {method: GET, path: /search, query: limit=notanumber, classification: READ_ONLY}
  - {method: GET, path: /search, query: limit=999, classification: READ_ONLY}
  - {method: GET, path: /search, query: limit=9, classification: READ_ONLY}
